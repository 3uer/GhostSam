name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run options selftest
        run: make -C exploit test

  app-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK (validates verifyPayloads + R8)
        run: cd app && ./gradlew assembleDebug --stacktrace
